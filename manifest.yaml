---
default_target: groups-all

includes:
  - config/includes/license.yaml
  - config/includes/funding.yaml

compiles:
  - name: local
    schemas:
      - config/schemas
    configs:
      - local/configs

templates:
  - local/templates
  - config/python/yambs/templates

commands:
  - name: "tree"
    command: "tree"
    force: true
    arguments:
      - "-a"
      - "-I"
      - "venv*|__pycache__|dist|*cov*|*-out|config|ninja|.ninja*|build|*.egg-info|tags|mklocal|.git*|.*cache*|third-party|docs|toolchains"
      - "--"
      - "project-name"

renders:
  - name: create-project.yml
    output_dir: ".github/workflows"
    dependencies:
      - compiles-local
    template_dependencies:
      - yambs_constants

  - name: local_README.md
    output_dir: "."
    output_path: README.md
    dependencies:
      - commands-tree
      - compiles-local

groups:
  - name: all
    dependencies:
      - groups-license
      - groups-funding
      - renders-local_README.md
      - renders-create-project.yml
